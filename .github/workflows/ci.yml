name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ['1.2.0', 'latest']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Was continue-on-error while biome.json was absent and lint emitted 750
      # diagnostics — CI stayed green while CONTRIBUTING.md and the PR template
      # both required lint to pass. The config now exists and the tree is clean,
      # so the gate is real.
      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The coverage thresholds in vitest.config.ts had never run:
      # @vitest/coverage-v8 was not installed, so --coverage errored out.
      - name: Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build
