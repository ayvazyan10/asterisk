name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ['1.2.0', 'latest']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # Without this the sandbox containment tests skip, and a test that passes
      # by not running is exactly what tests/sandbox.test.ts warns about.
      #
      # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor, so
      # bubblewrap installs fine but dies with "setting up uid map: Permission
      # denied" on every invocation. Relaxing the sysctl is what makes the
      # containment tests real rather than skipped. If it stops working the
      # probe reports no backend and the tests skip again — the suite stays
      # green either way, which is why `|| true` is acceptable here.
      - name: Install bubblewrap and ripgrep
        run: |
          # ripgrep backs /code; without it those tests skip or fail on CI and
          # the feature is only ever exercised on a developer's machine.
          sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev -- /bin/true && echo "bwrap functional" || echo "bwrap present but not functional"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Was continue-on-error while biome.json was absent and lint emitted 750
      # diagnostics — CI stayed green while CONTRIBUTING.md and the PR template
      # both required lint to pass. The config now exists and the tree is clean,
      # so the gate is real.
      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The coverage thresholds in vitest.config.ts had never run:
      # @vitest/coverage-v8 was not installed, so --coverage errored out.
      - name: Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build
