name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ['1.2.0', 'latest']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
